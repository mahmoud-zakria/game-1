            <div>
              <div class="text-sm font-black text-amber-950">الموسم الحالي: ${curSeason.name}</div>
              <div class="text-xs text-emerald-800 font-bold mt-0.5">${curSeason.bonusDesc}</div>
            </div>
            <button type="button" onclick="cycleSeason()" class="px-3.5 py-1.5 rounded-xl btn-gold text-xs font-extrabold">🔄 تغيير الموسم الزراعي</button>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-center">
            <div class="cozy-card p-3">
              <div class="text-xl">🌱</div>
              <div class="text-xs text-stone-600 font-bold">إجمالي الزراعة</div>
              <div class="text-base font-black text-amber-950">${state.stats.totalPlanted}</div>
            </div>
            <div class="cozy-card p-3">
              <div class="text-xl">🌾</div>
              <div class="text-xs text-stone-600 font-bold">إجمالي الحصاد</div>
              <div class="text-base font-black text-amber-950">${state.stats.totalHarvested}</div>
            </div>
            <div class="cozy-card p-3">
              <div class="text-xl">🥖</div>
              <div class="text-xs text-stone-600 font-bold">منتجات مصنعة</div>
              <div class="text-base font-black text-amber-950">${state.stats.totalCraftCollected}</div>
            </div>
            <div class="cozy-card p-3">
              <div class="text-xl">🏪</div>
              <div class="text-xs text-stone-600 font-bold">طلبات مكتملة</div>
              <div class="text-base font-black text-amber-950">${state.stats.totalOrdersCompleted}</div>
            </div>
          </div>

          <div class="flex justify-between items-center bg-red-50 border border-red-200 p-3 rounded-2xl">
            <span class="text-xs font-bold text-red-900">هل ترغب في بدء حكاية جديدة من الصفر؟</span>
            <button type="button" onclick="resetGameProgress()" class="px-3 py-1.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-extrabold">إعادة ضبط اللعبة</button>
          </div>
        `;
      } else if (activeModalName === 'deploy') {
        iconEl.textContent = '📥';
        titleEl.textContent = 'ملفات اللعبة وروابط النشر الفوري';
        subEl.textContent = 'حمّل ملف اللعبة الكامل على جهازك أو انشره أونلاين مجاناً في ثوانٍ';

        body.innerHTML = `
          <div class="cozy-card p-4 bg-emerald-50 border-2 border-emerald-400 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h3 class="font-black text-sm sm:text-base text-emerald-950">1️⃣ تحميل ملف اللعبة الكامل (Single-File HTML5 3D)</h3>
              <p class="text-xs text-emerald-800 mt-0.5">يحتوي هذا الملف على كل كود القرية والرسوم ثلاثية الأبعاد والبيانات والصوتيات في ملف واحد جاهز للتشغيل أو الرفع.</p>
            </div>
            <button type="button" onclick="downloadStandaloneHTML()" class="px-5 py-2.5 rounded-2xl btn-primary text-sm font-black shadow-lg">
              📥 تحميل ملف اللعبة (index.html)
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div class="cozy-card p-4 space-y-2">
              <div class="font-black text-sm text-amber-950">🚀 النشر المجاني بالسحب والإفلات (Netlify Drop)</div>
              <p class="text-xs text-stone-600">بعد تحميل ملف <code>index.html</code>، ضعه في مجلد واسحبه داخل موقع Netlify Drop لتحصل على رابط مباشر خلال 15 ثانية:</p>
              <a href="https://app.netlify.com/drop" target="_blank" rel="noopener noreferrer" class="inline-block w-full text-center py-2 rounded-xl btn-gold text-xs font-extrabold">🔗 فتح Netlify Drop</a>
            </div>

            <div class="cozy-card p-4 space-y-2">
              <div class="font-black text-sm text-amber-950">🎮 النشر على منصة الألعاب Itch.io</div>
              <p class="text-xs text-stone-600">ارفع ملف <code>index.html</code> واختر نوع المشروع <b>HTML</b> وفعّل خيار الهواتف لعرض لعبتك للجمهور:</p>
              <a href="https://itch.io/game/new" target="_blank" rel="noopener noreferrer" class="inline-block w-full text-center py-2 rounded-xl btn-earth text-xs font-extrabold">🔗 رفع اللعبة على Itch.io</a>
            </div>
          </div>
        `;
      }
    }

    function cycleSeason() {
      state.seasonIndex = ((state.seasonIndex || 0) + 1) % SEASONS.length;
      const cur = SEASONS[state.seasonIndex];
      playSound('coin');
      showToast(`🌾 بدأ ${cur.name}: ${cur.bonusDesc}!`, 'info');
      updateHUD();
      renderInspector();
      refreshActiveModal();
      saveGame();
    }
    window.cycleSeason = cycleSeason;

    function selectSeedAndPlant(seedId) {
      state.selectedSeed = seedId;
      populateQuickSeedSelect();
      const emptyPlot = state.plots.find(p => p.unlocked && !p.cropId);
      if (emptyPlot) {
        plantPlot(emptyPlot.id, seedId);
      } else {
        showToast(`✓ تم اختيار بذرة ${ITEM_CATALOG[seedId].name}. اضغط على أي أرض فارغة لزراعتها!`, 'info');
      }
      refreshActiveModal();
    }
    window.selectSeedAndPlant = selectSeedAndPlant;

    function buyAnimal(animalId) {
      const a = GAME_DATA.animals.find(x => x.id === animalId);
      if (!a) return;
      const st = state.animals[animalId];
      if (st.owned) return;
      if (state.level < a.unlockLevel) {
        playSound('error');
        showToast(`🔒 يتطلب المستوى ${a.unlockLevel}`, 'warn');
        return;
      }
      if (state.coins < a.buyCost) {
        playSound('error');
        showToast(`🪙 رصيدك غير كافٍ لشراء ${a.name} (${a.buyCost} ج.م).`, 'error');
        return;
      }
      state.coins -= a.buyCost;
      st.owned = true;
      st.feeding = true;
      st.elapsedSec = 0;
      playSound('coin');
      showToast(`🐄 مبروك! انضمت ${a.name} إلى حظيرة القرية وبدأت الإنتاج!`, 'success');
      sync3DWorld();
      updateHUD();
      refreshActiveModal();
      saveGame();
    }
    window.buyAnimal = buyAnimal;

    function feedAnimal(animalId, buyInstantFeed) {
      const a = GAME_DATA.animals.find(x => x.id === animalId);
      const st = state.animals[animalId];
      if (!a || !st || !st.owned || st.feeding) return;

      if (buyInstantFeed) {
        if (state.coins < a.feedCostCoins) {
          playSound('error');
          showToast('🪙 رصيدك غير كافٍ لشراء العلف الفوري!', 'error');
          return;
        }
        state.coins -= a.feedCostCoins;
      } else {
        if ((state.inventory[a.feedItem] || 0) > 0) {
          state.inventory[a.feedItem] -= 1;
        } else if ((state.inventory['animal_feed'] || 0) > 0) {
          state.inventory['animal_feed'] -= 1;
        } else {
          playSound('error');
          showToast(`🌾 لا يوجد ${ITEM_CATALOG[a.feedItem].name} في المخزن! ازرعه أو استخدم العلف الفوري.`, 'warn');
          return;
        }
      }

      st.feeding = true;
      st.elapsedSec = 0;
      playSound('plant');
      showToast(`🌿 تم إطعام ${a.name} وبدأ إنتاج ${a.productName}!`, 'success');
      updateHUD();
      refreshActiveModal();
      saveGame();
    }
    window.feedAnimal = feedAnimal;

    function collectAnimal(animalId) {
      const a = GAME_DATA.animals.find(x => x.id === animalId);
      const st = state.animals[animalId];
      if (!a || !st || !st.owned || !st.feeding || st.elapsedSec < a.prodTimeSec) return;

      if (!addToInventory(a.productId, 1)) return;
      st.feeding = false;
      st.elapsedSec = 0;
      state.stats.totalAnimalCollected += 1;
      playSound('harvest');
      addXpAndCoins(0, a.xp, `+1 ${a.productIcon} ${a.productName}`);
      showToast(`🥛 جمعت ${a.productName} وأضفته إلى المخزن!`, 'success');
      updateHUD();
      refreshActiveModal();
      saveGame();
    }
    window.collectAnimal = collectAnimal;

    function startCraft(facilityId, recipeId) {
      const fac = GAME_DATA.facilities.find(f => f.id === facilityId);
      const st = state.facilities[facilityId];
      if (!fac || !st || st.activeRecipeId) return;
      const rec = fac.recipes.find(r => r.id === recipeId);
      if (!rec) return;

      if (!consumeIngredients(rec.inputs)) {
        playSound('error');
        showToast('⚠️ المكونات غير كافية في المخزن لتشغيل الوصفة!', 'warn');
        return;
      }
      st.activeRecipeId = rec.id;
      st.elapsedSec = 0;
      state.stats.totalCraftStarted += 1;
      playSound('plant');
      showToast(`🔥 بدأ تحضير "${rec.name}" في ${fac.name}!`, 'success');
      updateHUD();
      refreshActiveModal();
      saveGame();
    }
    window.startCraft = startCraft;

    function collectCraft(facilityId) {
      const fac = GAME_DATA.facilities.find(f => f.id === facilityId);
      const st = state.facilities[facilityId];
      if (!fac || !st || !st.activeRecipeId) return;
      const rec = fac.recipes.find(r => r.id === st.activeRecipeId);
      if (!rec || st.elapsedSec < rec.timeSec) return;

      if (!addToInventory(rec.id, 1)) return;
      st.activeRecipeId = null;
      st.elapsedSec = 0;
      state.stats.totalCraftCollected += 1;
      playSound('harvest');
      addXpAndCoins(0, rec.xp, `+1 ${rec.icon} ${rec.name}`);
      showToast(`🥖 استلمت "${rec.name}" وأضفته إلى المخزن!`, 'success');
      updateHUD();
      refreshActiveModal();
      saveGame();
    }
    window.collectCraft = collectCraft;

    function sellInventoryItem(itemId, count) {
      const avail = state.inventory[itemId] || 0;
      const toSell = Math.min(avail, count);
      if (toSell <= 0) return;
      const meta = ITEM_CATALOG[itemId];
      if (!meta) return;

      state.inventory[itemId] -= toSell;
      const earned = getItemEffectivePrice(itemId) * toSell;
      state.stats.totalSoldItems += toSell;
      playSound('coin');
      addXpAndCoins(earned, toSell * 2, `+${earned} ج.م 🪙`);
      showToast(`🪙 بعت ${toSell}× ${meta.name} مقابل ${earned} ج.م!`, 'success');
      updateHUD();
      refreshActiveModal();
      saveGame();
    }
    window.sellInventoryItem = sellInventoryItem;

    function fulfillOrder(orderIndex) {
      const ord = state.orders[orderIndex];
      if (!ord) return;
      if (!consumeIngredients(ord.items)) {
        playSound('error');
        showToast('⚠️ لا تمتلك جميع عناصر الطلب في المخزن بعد!', 'warn');
        return;
      }

      state.stats.totalOrdersCompleted += 1;
      playSound('levelup');
      addXpAndCoins(ord.rewardCoins, ord.rewardXp, `+${ord.rewardCoins} ج.م 🏪`);
      const npc = NPC_PROFILES[ord.npcId] || NPC_PROFILES.shawky;
      showToast(`🎉 تسلم إيدك! استلم ${npc.name} الطلبية ومنحك ${ord.rewardCoins} ج.م و ${ord.rewardXp} خبرة!`, 'success');

      state.orders[orderIndex] = generateOrder(orderIndex + Math.floor(Math.random() * 10));
      updateHUD();
      refreshActiveModal();
      saveGame();
    }
    window.fulfillOrder = fulfillOrder;

    function refreshSingleOrder(orderIndex) {
      state.orders[orderIndex] = generateOrder(orderIndex + Math.floor(Math.random() * 20));
      playSound('plant');
      showToast('🔄 تم تحديث الطلب بطلبية جديدة من أهل القرية.', 'info');
      refreshActiveModal();
      saveGame();
    }
    window.refreshSingleOrder = refreshSingleOrder;

    function buyUpgrade(upgradeId) {
      const u = GAME_DATA.upgrades.find(x => x.id === upgradeId);
      if (!u) return;
      const curLvl = state.upgrades[upgradeId] || 0;
      if (curLvl >= u.maxLevel) return;
      const cost = Math.round(u.baseCost * Math.pow(u.costMult, curLvl));
      if (state.coins < cost) {
        playSound('error');
        showToast(`🪙 رصيدك غير كافٍ لتنفيذ التطوير (${cost} ج.م).`, 'error');
        return;
      }

      state.coins -= cost;
      state.upgrades[upgradeId] = curLvl + 1;
      state.stats.totalUpgradesBought += 1;

      if (upgradeId === 'expand_plots') {
        let unlockedNow = 0;
        for (let i = 0; i < state.plots.length; i++) {
          if (!state.plots[i].unlocked && unlockedNow < 2) {
            state.plots[i].unlocked = true;
            unlockedNow++;
          }
        }
      }

      playSound('levelup');
      addXpAndCoins(0, 25, `🛠️ تطوير: ${u.name}`);
      showToast(`🛠️ تم تنفيذ "${u.name}" بنجاح مع المهندس حسن!`, 'success');
      sync3DWorld();
      updateHUD();
      renderInspector();
      refreshActiveModal();
      saveGame();
    }
    window.buyUpgrade = buyUpgrade;

    function resetGameProgress() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      state = createInitialState();
      ensureOrders();
      populateQuickSeedSelect();
      sync3DWorld();
      updateHUD();
      renderInspector();
      closeModal();
      showToast('🔄 تمت إعادة ضبط القرية والمزرعة إلى البداية بنجاح!', 'info');
    }
    window.resetGameProgress = resetGameProgress;
    window.plantPlot = plantPlot;
    window.waterPlot = waterPlot;
    window.harvestPlot = harvestPlot;
    window.waterAllPlantedPlots = waterAllPlantedPlots;
    window.plantAllEmptyPlots = plantAllEmptyPlots;
    window.harvestAllReadyPlots = harvestAllReadyPlots;
    window.refreshActiveModal = refreshActiveModal;

    function bindUIControls() {
      document.getElementById('btn-cam-zoom-in').addEventListener('click', () => {
        cameraState.zoom = Math.min(1.85, cameraState.zoom + 0.18);
        state.stats.cameraMoves += 1;
        updateHUD();
      });
      document.getElementById('btn-cam-zoom-out').addEventListener('click', () => {
        cameraState.zoom = Math.max(0.65, cameraState.zoom - 0.18);
        state.stats.cameraMoves += 1;
        updateHUD();
      });
      document.getElementById('btn-cam-rotate').addEventListener('click', () => {
        cameraState.yawIndex = (cameraState.yawIndex + 1) % 4;
        cameraState.targetYawAngle = Math.PI / 4 + cameraState.yawIndex * (Math.PI / 2);
        const deg = 45 + cameraState.yawIndex * 90;
        document.getElementById('camera-angle-badge').textContent = `زاوية ${deg}°`;
        state.stats.cameraMoves += 1;
        updateHUD();
      });
      document.getElementById('btn-cam-reset').addEventListener('click', () => {
        cameraState.targetX = 0;
        cameraState.targetZ = 0;
        cameraState.zoom = 1.05;
        cameraState.yawIndex = 0;
        cameraState.targetYawAngle = Math.PI / 4;
        document.getElementById('camera-angle-badge').textContent = 'زاوية 45°';
        state.stats.cameraMoves += 1;
        updateHUD();
      });

      document.querySelectorAll('.cam-jump-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.camTarget;
          const bm = CAMERA_BOOKMARKS[key];
          if (bm) {
            cameraState.targetX = bm.x;
            cameraState.targetZ = bm.z;
            cameraState.zoom = bm.zoom;
            state.stats.cameraMoves += 1;
            showToast(`🎥 انتقال الكاميرا: ${bm.label}`, 'info');
            updateHUD();
          }
        });
      });

      document.getElementById('btn-hud-storage').addEventListener('click', () => openModal('storage'));
      document.getElementById('btn-mayor-modal').addEventListener('click', () => openModal('mayor'));
      document.getElementById('btn-deploy-modal').addEventListener('click', () => openModal('deploy'));
      document.getElementById('season-badge').addEventListener('click', () => cycleSeason());

      document.getElementById('btn-speed-toggle').addEventListener('click', () => {
        state.speedMultiplier = state.speedMultiplier === 1 ? 4 : (state.speedMultiplier === 4 ? 10 : 1);
        document.getElementById('speed-label').textContent = `سرعة ×${state.speedMultiplier}`;
        showToast(`⚡ سرعة نمو المحاصيل والإنتاج الآن: ×${state.speedMultiplier}`, 'info');
      });

      document.getElementById('btn-instant-grow').addEventListener('click', () => instantGrowAll());

      document.getElementById('btn-time-toggle').addEventListener('click', () => {
        state.dayMode = state.dayMode === 'day' ? 'golden' : (state.dayMode === 'golden' ? 'night' : 'day');
        document.getElementById('time-label').textContent = state.dayMode === 'golden' ? 'ساعة العصاري' : (state.dayMode === 'night' ? 'ليل القرية' : 'شمس الضحى');
        if (useThreeWebGL && scene && dirLight) {
          scene.background.setHex(state.dayMode === 'golden' ? 0xfed7aa : (state.dayMode === 'night' ? 0x0f172a : 0xdbeafe));
          dirLight.color.setHex(state.dayMode === 'golden' ? 0xfdba74 : (state.dayMode === 'night' ? 0x93c5fd : 0xfff7ed));
        }
      });

      document.getElementById('btn-audio-toggle').addEventListener('click', e => {
        state.audioMuted = !state.audioMuted;
        e.currentTarget.textContent = state.audioMuted ? '🔇' : '🔊';
      });

      document.querySelectorAll('.farm-tool-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedTool = btn.dataset.tool;
          document.querySelectorAll('.farm-tool-btn').forEach(b => b.classList.toggle('tool-btn-active', b === btn));
        });
      });

      document.getElementById('quick-seed-select').addEventListener('change', e => {
        state.selectedSeed = e.target.value;
        renderInspector();
      });

      document.getElementById('btn-plant-all').addEventListener('click', () => plantAllEmptyPlots());
      document.getElementById('btn-water-all').addEventListener('click', () => waterAllPlantedPlots());
      document.getElementById('btn-harvest-all').addEventListener('click', () => harvestAllReadyPlots());

      document.querySelectorAll('.bottom-nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.dataset.modal;
          if (activeModalName === target) closeModal();
          else openModal(target);
        });
      });

      document.getElementById('btn-close-modal').addEventListener('click', () => closeModal());
      document.getElementById('modal-backdrop').addEventListener('click', e => {
        if (e.target.id === 'modal-backdrop') closeModal();
      });
    }

    window.instantGrowAll = instantGrowAll;
    window.closeModal = closeModal;
    let hasBooted = false;
    function bootApp() {
      if (hasBooted) return;
      hasBooted = true;
      loadGame();
      populateQuickSeedSelect();
      bindUIControls();
      init3DEngine();
      updateHUD();
      renderInspector();
      requestAnimationFrame(gameLoop);
      setInterval(saveGame, 5000);
    }
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', bootApp);
    } else {
      bootApp();
    }
  </script>
</body>
</html>
