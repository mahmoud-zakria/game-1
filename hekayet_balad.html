<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>حكاية بلد | Hekayet Balad — قرية ومزرعة مصرية ثلاثية الأبعاد</title>
  <script src="https://cdn.tailwindcss.com/3.4.17" async></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" async onload="if(window.tryUpgradeThreeJS) window.tryUpgradeThreeJS()"></script>
  <style>
    :root {
      --bg-sand: #fdf6e9;
      --earth-brown: #5c3a21;
      --nile-blue: #1e6b7b;
      --delta-green: #2d7a47;
      --gold-wheat: #d97706;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Cairo', 'Noto Sans Arabic', system-ui, -apple-system, sans-serif;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1b4332;
      color: #2b1d0e;
      direction: rtl;
    }
    #game-viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #game-canvas:active {
      cursor: grabbing;
    }
    .cozy-panel {
      background: linear-gradient(180deg, rgba(255, 250, 240, 0.96) 0%, rgba(247, 236, 213, 0.96) 100%);
      border: 2px solid #b48347;
      box-shadow: 0 8px 24px rgba(43, 29, 14, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
    }
    .cozy-card {
      background: #fffdf8;
      border: 1.5px solid #dec397;
      border-radius: 14px;
      transition: all 0.18s ease;
    }
    .cozy-card:hover {
      border-color: #b47b32;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(92, 58, 33, 0.12);
    }
    .btn-primary {
      background: linear-gradient(180deg, #2e8540 0%, #1e632d 100%);
      color: #ffffff;
      border: 1px solid #164921;
      box-shadow: 0 3px 0 #123c1b;
      transition: all 0.12s ease;
    }
    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    .btn-primary:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #123c1b;
    }
    .btn-primary:disabled {
      opacity: 0.48;
      cursor: not-allowed;
      filter: grayscale(0.4);
    }
    .btn-gold {
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
      color: #fff;
      border: 1px solid #92400e;
      box-shadow: 0 3px 0 #78350f;
      transition: all 0.12s ease;
    }
    .btn-gold:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    .btn-gold:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #78350f;
    }
    .btn-gold:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }
    .btn-earth {
      background: linear-gradient(180deg, #8c5a32 0%, #694121 100%);
      color: #fff8eb;
      border: 1px solid #4a2c14;
      box-shadow: 0 3px 0 #3a210e;
      transition: all 0.12s ease;
    }
    .btn-earth:hover:not(:disabled) {
      filter: brightness(1.1);
    }
    .tool-btn-active {
      background: linear-gradient(180deg, #fef3c7 0%, #fde68a 100%) !important;
      border-color: #d97706 !important;
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.35), 0 4px 10px rgba(0,0,0,0.18) !important;
      transform: translateY(-3px);
    }
    .nav-tab-active {
      background: linear-gradient(180deg, #d97706 0%, #b45309 100%) !important;
      color: #ffffff !important;
      border-color: #78350f !important;
      transform: translateY(-3px);
    }
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(222, 195, 151, 0.25);
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: #b48347;
      border-radius: 8px;
    }
    @keyframes floatUpFade {
      0% { opacity: 1; transform: translateY(0) scale(0.95); }
      100% { opacity: 0; transform: translateY(-48px) scale(1.08); }
    }
    .floating-reward {
      position: absolute;
      pointer-events: none;
      animation: floatUpFade 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 45;
      font-weight: 800;
      text-shadow: 0 2px 4px rgba(0,0,0,0.45);
    }
    #modal-backdrop { background-color: rgba(20, 14, 8, 0.62); backdrop-filter: blur(4px); }
    #modal-backdrop > div > div:first-child {
      background: linear-gradient(90deg, #5c3a21 0%, #78350f 50%, #5c3a21 100%);
      color: #fffbeb;
      border-bottom: 2px solid #b48347;
    }
    #toast-container > div {
      background: linear-gradient(180deg, #1e3a2f 0%, #132a21 100%);
      color: #fef3c7;
      border: 1.5px solid #f59e0b;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body class="relative w-full h-full select-none overflow-hidden">

  <!-- 3D ISOMETRIC VIEWPORT -->
  <div id="game-viewport">
    <canvas id="game-canvas"></canvas>
  </div>

  <!-- FLOATING TEXT OVERLAY CONTAINER -->
  <div id="floating-fx-layer" class="pointer-events-none fixed inset-0 z-30 overflow-hidden"></div>

  <!-- TOAST NOTIFICATION BANNER -->
  <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none w-11/12 max-w-md"></div>

  <!-- TOP HUD BAR -->
  <header class="fixed top-2 inset-x-2 z-30 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
    <div class="flex items-center gap-2 pointer-events-auto cozy-panel px-3 py-1.5 rounded-2xl">
      <div class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-xl bg-amber-600 text-white flex flex-col items-center justify-center font-black shadow-inner border border-amber-800">
          <span class="text-[10px] leading-none opacity-85">مستوى</span>
          <span id="hud-level" class="text-lg leading-tight">1</span>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="font-extrabold text-sm sm:text-base text-amber-950 leading-tight">حكاية بلد</h1>
            <span id="season-badge" class="text-[11px] bg-emerald-100 text-emerald-800 border border-emerald-300 px-1.5 py-0.5 rounded-full font-bold cursor-pointer" title="انقر لتغيير الموسم الزراعي">🌾 الموسم الشتوي</span>
          </div>
          <div class="w-28 sm:w-36 bg-amber-950/15 h-3 rounded-full overflow-hidden mt-1 relative border border-amber-900/20">
            <div id="hud-xp-bar" class="bg-gradient-to-l from-emerald-500 to-teal-600 h-full transition-all duration-300" style="width: 0%"></div>
            <span id="hud-xp-text" class="absolute inset-0 flex items-center justify-center text-[9px] font-extrabold text-amber-950">0 / 50 خبرة</span>
          </div>
        </div>
      </div>

      <div class="h-8 w-px bg-amber-800/20 mx-1 hidden sm:block"></div>

      <div class="flex items-center gap-2 sm:gap-3">
        <div class="flex items-center gap-1.5 bg-amber-100/90 border border-amber-300 px-2.5 py-1 rounded-xl">
          <span class="text-base">🪙</span>
          <div>
            <div class="text-[10px] text-amber-800 font-bold leading-none">الرصيد</div>
            <div class="text-xs sm:text-sm font-black text-amber-950"><span id="hud-coins">180</span> ج.م</div>
          </div>
        </div>

        <button id="btn-hud-storage" type="button" class="flex items-center gap-1.5 bg-orange-50/90 hover:bg-orange-100 border border-orange-300 px-2.5 py-1 rounded-xl transition" title="فتح المخزن والصومعة">
          <span class="text-base">🏺</span>
          <div class="text-right">
            <div class="text-[10px] text-orange-800 font-bold leading-none">المخزن</div>
            <div class="text-xs sm:text-sm font-black text-orange-950"><span id="hud-storage-used">0</span>/<span id="hud-storage-max">50</span></div>
          </div>
        </button>

        <div class="hidden md:flex items-center gap-1.5 bg-emerald-50/90 border border-emerald-300 px-2.5 py-1 rounded-xl">
          <span class="text-base">🌱</span>
          <div>
            <div class="text-[10px] text-emerald-800 font-bold leading-none">الأراضي</div>
            <div class="text-xs sm:text-sm font-black text-emerald-950"><span id="hud-plots-unlocked">12</span>/20</div>
          </div>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-1.5 pointer-events-auto cozy-panel px-2.5 py-1.5 rounded-2xl">
      <button id="btn-speed-toggle" type="button" class="px-2.5 py-1 rounded-xl text-xs font-extrabold bg-amber-500/20 hover:bg-amber-500/30 border border-amber-600/40 text-amber-950 flex items-center gap-1 transition" title="تغيير سرعة النمو لاختبار أسرع">
        <span>⚡</span>
        <span id="speed-label">سرعة ×1</span>
      </button>
      <button id="btn-instant-grow" type="button" class="px-2.5 py-1 rounded-xl text-xs font-extrabold bg-emerald-600/15 hover:bg-emerald-600/25 border border-emerald-700/30 text-emerald-900 flex items-center gap-1 transition" title="إنضاج جميع المزروعات والمنتجات فوراً">
        <span>✨</span>
        <span class="hidden sm:inline">إنضاج فوري</span>
      </button>
      <button id="btn-time-toggle" type="button" class="px-2 py-1 rounded-xl text-xs font-bold bg-sky-500/15 hover:bg-sky-500/25 border border-sky-600/30 text-sky-950 transition" title="تبديل إضاءة النهار / العصاري / الليل">
        ☀️ <span id="time-label" class="hidden md:inline">شمس الضحى</span>
      </button>
      <button id="btn-audio-toggle" type="button" class="px-2 py-1 rounded-xl text-xs font-bold bg-amber-900/10 hover:bg-amber-900/20 border border-amber-900/20 text-amber-950 transition" title="تشغيل/كتم الصوت">
        🔊
      </button>
      <button id="btn-mayor-modal" type="button" class="px-2.5 py-1 rounded-xl text-xs font-extrabold btn-gold flex items-center gap-1" title="ديوان العمدة والأوسمة">
        <span>👑</span>
        <span class="hidden sm:inline">ديوان العمدة</span>
      </button>
      <button id="btn-deploy-modal" type="button" class="px-2.5 py-1 rounded-xl text-xs font-extrabold btn-primary flex items-center gap-1" title="تحميل ملفات اللعبة وروابط النشر">
        <span>📥</span>
        <span>ملفات اللعبة والنشر</span>
      </button>
    </div>
  </header>

  <!-- RIGHT SIDEBAR: CAMERA & VILLAGE TOUR CONTROLS + ACTIVE QUEST TRACKER -->
  <aside class="fixed top-20 right-2 z-20 flex flex-col gap-2 w-48 sm:w-56 pointer-events-none">
    <div class="cozy-panel p-2.5 rounded-2xl pointer-events-auto">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-xs font-extrabold text-amber-950 flex items-center gap-1">🎥 كاميرا القرية (3D)</span>
        <span id="camera-angle-badge" class="text-[10px] bg-amber-900/10 px-1.5 py-0.5 rounded font-bold text-amber-900">زاوية 45°</span>
      </div>
      <div class="grid grid-cols-4 gap-1 mb-2">
        <button id="btn-cam-zoom-in" type="button" class="bg-white hover:bg-amber-50 border border-amber-300 rounded-lg py-1 text-xs font-black text-amber-950 shadow-sm" title="تقريب الكاميرا">➕</button>
        <button id="btn-cam-zoom-out" type="button" class="bg-white hover:bg-amber-50 border border-amber-300 rounded-lg py-1 text-xs font-black text-amber-950 shadow-sm" title="تبعيد الكاميرا">➖</button>
        <button id="btn-cam-rotate" type="button" class="bg-white hover:bg-amber-50 border border-amber-300 rounded-lg py-1 text-xs font-black text-amber-950 shadow-sm" title="تدوير الكاميرا حول القرية">🔄</button>
        <button id="btn-cam-reset" type="button" class="bg-white hover:bg-amber-50 border border-amber-300 rounded-lg py-1 text-xs font-black text-amber-950 shadow-sm" title="إعادة ضبط الكاميرا">🎯</button>
      </div>
      <div class="text-[10px] font-bold text-amber-800 mb-1">انتقال سريع لمعالم القرية:</div>
      <div class="grid grid-cols-2 gap-1 text-[11px] font-bold">
        <button type="button" data-cam-target="farm" class="cam-jump-btn bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 text-emerald-950 rounded-lg py-1 px-1.5 text-right truncate">🌾 الحقول (20)</button>
        <button type="button" data-cam-target="canal" class="cam-jump-btn bg-sky-50 hover:bg-sky-100 border border-sky-300 text-sky-950 rounded-lg py-1 px-1.5 text-right truncate">🌊 الترعة والساقية</button>
        <button type="button" data-cam-target="barn" class="cam-jump-btn bg-amber-50 hover:bg-amber-100 border border-amber-300 text-amber-950 rounded-lg py-1 px-1.5 text-right truncate">🐄 الحظيرة (5)</button>
        <button type="button" data-cam-target="workshops" class="cam-jump-btn bg-orange-50 hover:bg-orange-100 border border-orange-300 text-orange-950 rounded-lg py-1 px-1.5 text-right truncate">🥖 الفرن والورش</button>
        <button type="button" data-cam-target="souq" class="cam-jump-btn bg-purple-50 hover:bg-purple-100 border border-purple-300 text-purple-950 rounded-lg py-1 px-1.5 text-right truncate">🏪 السوق الشعبي</button>
        <button type="button" data-cam-target="overview" class="cam-jump-btn bg-stone-100 hover:bg-stone-200 border border-stone-300 text-stone-900 rounded-lg py-1 px-1.5 text-right truncate">🏡 نظرة شاملة</button>
      </div>
    </div>

    <div class="cozy-panel p-2.5 rounded-2xl pointer-events-auto">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs font-extrabold text-amber-950 flex items-center gap-1">📜 المهمة الحالية</span>
        <span id="tracker-quest-progress-count" class="text-[10px] font-bold text-emerald-800 bg-emerald-100 px-1.5 py-0.5 rounded-full">0 / 30</span>
      </div>
      <div id="active-quest-box" class="bg-white/90 border border-amber-200 rounded-xl p-2 text-xs"></div>
    </div>
  </aside>

  <!-- LEFT SIDEBAR: SELECTED 3D OBJECT INSPECTOR -->
  <aside id="inspector-card" class="fixed top-20 left-2 z-20 w-56 sm:w-64 cozy-panel p-3 rounded-2xl pointer-events-auto transition-all duration-200">
    <div class="flex items-center justify-between border-b border-amber-900/15 pb-1.5 mb-2">
      <div class="flex items-center gap-1.5">
        <span id="inspector-icon" class="text-xl">🌾</span>
        <div>
          <h2 id="inspector-title" class="text-xs sm:text-sm font-extrabold text-amber-950 leading-tight">قطعة أرض زراعية #1</h2>
          <p id="inspector-subtitle" class="text-[10px] text-amber-800 font-semibold">أرض خصبة بجانب الترعة</p>
        </div>
      </div>
    </div>
    <div id="inspector-body" class="text-xs space-y-2"></div>
  </aside>

  <!-- FARMING QUICK-TOOLS BAR -->
  <div class="fixed bottom-20 left-1/2 -translate-x-1/2 z-20 flex items-center gap-1.5 cozy-panel px-3 py-1.5 rounded-2xl pointer-events-auto shadow-lg max-w-[96vw] overflow-x-auto">
    <span class="text-[11px] font-extrabold text-amber-900 ml-1 whitespace-nowrap hidden sm:inline">أدوات المزرعة:</span>

    <button type="button" data-tool="select" class="farm-tool-btn tool-btn-active flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-white border border-amber-300 text-xs font-extrabold text-amber-950 whitespace-nowrap transition">
      <span>🌱</span>
      <span>زراعة / فحص</span>
    </button>

    <div class="flex items-center bg-emerald-50 border border-emerald-300 rounded-xl px-2 py-1 gap-1">
      <span class="text-[10px] font-bold text-emerald-800">البذرة:</span>
      <select id="quick-seed-select" aria-label="اختيار البذرة السريع" class="bg-transparent text-xs font-extrabold text-emerald-950 focus:outline-none cursor-pointer"></select>
    </div>

    <button type="button" data-tool="water" class="farm-tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-white border border-amber-300 text-xs font-extrabold text-sky-950 whitespace-nowrap transition">
      <span>💧</span>
      <span>ريّ من الترعة</span>
    </button>

    <button type="button" data-tool="harvest" class="farm-tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-white border border-amber-300 text-xs font-extrabold text-amber-950 whitespace-nowrap transition">
      <span>🌾</span>
      <span>منجل الحصاد</span>
    </button>

    <div class="h-5 w-px bg-amber-900/20 mx-0.5"></div>

    <button id="btn-plant-all" type="button" class="px-2.5 py-1.5 rounded-xl btn-primary text-xs font-extrabold whitespace-nowrap flex items-center gap-1" title="زراعة جميع الأراضي الفارغة بالبذرة المختارة">
      <span>🚜</span>
      <span>زراعة الفارغ</span>
    </button>

    <button id="btn-water-all" type="button" class="px-2.5 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-extrabold whitespace-nowrap flex items-center gap-1 shadow" title="ري جميع الأراضي المزروعة من الساقية">
      <span>🌊</span>
      <span>ريّ الكل</span>
    </button>

    <button id="btn-harvest-all" type="button" class="px-2.5 py-1.5 rounded-xl btn-gold text-xs font-extrabold whitespace-nowrap flex items-center gap-1" title="حصاد جميع المحاصيل الناضجة دفعة واحدة">
      <span>✨</span>
      <span>حصاد الجاهز</span>
    </button>
  </div>

  <!-- BOTTOM MAIN NAVIGATION BAR (RTL) -->
  <nav class="fixed bottom-2 left-1/2 -translate-x-1/2 z-30 flex items-center gap-1.5 sm:gap-2 cozy-panel px-3 py-2 rounded-2xl pointer-events-auto max-w-[98vw] overflow-x-auto">
    <button type="button" data-modal="seeds" class="bottom-nav-btn flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white hover:bg-amber-50 border border-amber-300 text-xs sm:text-sm font-extrabold text-amber-950 whitespace-nowrap transition shadow-sm">
      <span class="text-base">🌾</span>
      <span>الأرض والبذور</span>
    </button>

    <button type="button" data-modal="barn" class="bottom-nav-btn flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white hover:bg-amber-50 border border-amber-300 text-xs sm:text-sm font-extrabold text-amber-950 whitespace-nowrap transition shadow-sm relative">
      <span class="text-base">🐄</span>
      <span>الحظيرة (5)</span>
      <span id="badge-barn-ready" class="hidden absolute -top-1.5 -left-1.5 bg-red-600 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow">!</span>
    </button>

    <button type="button" data-modal="crafting" class="bottom-nav-btn flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white hover:bg-amber-50 border border-amber-300 text-xs sm:text-sm font-extrabold text-amber-950 whitespace-nowrap transition shadow-sm relative">
      <span class="text-base">🥖</span>
      <span>التصنيع (5)</span>
      <span id="badge-craft-ready" class="hidden absolute -top-1.5 -left-1.5 bg-red-600 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow">!</span>
    </button>

    <button type="button" data-modal="storage" class="bottom-nav-btn flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white hover:bg-amber-50 border border-amber-300 text-xs sm:text-sm font-extrabold text-amber-950 whitespace-nowrap transition shadow-sm">
      <span class="text-base">🏺</span>
      <span>المخزن والبيع</span>
    </button>

    <button type="button" data-modal="souq" class="bottom-nav-btn flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white hover:bg-amber-50 border border-amber-300 text-xs sm:text-sm font-extrabold text-amber-950 whitespace-nowrap transition shadow-sm relative">
      <span class="text-base">🏪</span>
      <span>السوق والطلبات</span>
      <span id="badge-orders-ready" class="hidden absolute -top-1.5 -left-1.5 bg-emerald-600 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow">✓</span>
    </button>

    <button type="button" data-modal="upgrades" class="bottom-nav-btn flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white hover:bg-amber-50 border border-amber-300 text-xs sm:text-sm font-extrabold text-amber-950 whitespace-nowrap transition shadow-sm">
      <span class="text-base">🛠️</span>
      <span>التطوير والتوسعة</span>
    </button>

    <button type="button" data-modal="quests" class="bottom-nav-btn flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white hover:bg-amber-50 border border-amber-300 text-xs sm:text-sm font-extrabold text-amber-950 whitespace-nowrap transition shadow-sm relative">
      <span class="text-base">📜</span>
      <span>المهمات (30)</span>
      <span id="badge-quests-ready" class="hidden absolute -top-1.5 -left-1.5 bg-amber-500 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow">★</span>
    </button>
  </nav>

  <!-- UNIVERSAL MODAL DRAWER FOR ALL GAME SYSTEMS -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-40 hidden flex items-center justify-center p-2 sm:p-4">

      { id: 24, npc: 'salma', title: 'نهضة الصناعات الريفية', desc: 'أكمل تصنيع 7 منتجات حرفية وغذائية في الورش.', stat: 'totalCraftCollected', target: 7, rewardCoins: 310, rewardXp: 160 },
      { id: 25, npc: 'shawky', title: 'عميد السوق الشعبي', desc: 'أنجز 6 طلبات كاملة لأهل القرية.', stat: 'totalOrdersCompleted', target: 6, rewardCoins: 350, rewardXp: 180 },
      { id: 26, npc: 'hassan', title: 'استصلاح الـ 18 فداناً', desc: 'افتح 18 قطعة أرض زراعية.', stat: 'unlockedPlotsCount', target: 18, rewardCoins: 380, rewardXp: 190 },
      { id: 27, npc: 'shawky', title: 'قافلة التجارة المصرية', desc: 'بع 25 منتجاً أو محصولاً في السوق.', stat: 'totalSoldItems', target: 25, rewardCoins: 400, rewardXp: 200 },
      { id: 28, npc: 'salma', title: 'وفرة الألبان والبيض', desc: 'اجمع 12 منتجاً حيوانياً من الحظيرة.', stat: 'totalAnimalCollected', target: 12, rewardCoins: 420, rewardXp: 210 },
      { id: 29, npc: 'hassan', title: 'القرية النموذجية المتكاملة', desc: 'افتح جميع الـ 20 قطعة أرض زراعية بالكامل.', stat: 'unlockedPlotsCount', target: 20, rewardCoins: 500, rewardXp: 250 },
      { id: 30, npc: 'ragab', title: 'وسام حكاية بلد الذهبي', desc: 'نفّذ 6 ترقيات شاملة في القرية والمزرعة.', stat: 'totalUpgradesBought', target: 6, rewardCoins: 750, rewardXp: 400 }
    ];

    const STORAGE_KEY = 'hekayet_balad_save_v1';

    function createInitialState() {
      const plots = [];
      for (let i = 0; i < 20; i++) {
        plots.push({
          id: i,
          unlocked: i < 12,
          cropId: i === 0 ? 'wheat' : (i === 1 ? 'clover' : (i === 2 ? 'corn' : null)),
          plantedAt: i < 3 ? Date.now() - 8000 : 0,
          elapsedSec: i === 0 ? 10 : (i === 1 ? 4 : (i === 2 ? 7 : 0)),
          watered: i === 0 || i === 1
        });
      }

      const animals = {};
      GAME_DATA.animals.forEach((a, idx) => {
        animals[a.id] = {
          owned: idx === 0 || idx === 3,
          feeding: idx === 0,
          elapsedSec: idx === 0 ? 10 : 0
        };
      });

      const facilities = {};
      GAME_DATA.facilities.forEach(f => {
        facilities[f.id] = {
          activeRecipeId: null,
          elapsedSec: 0
        };
      });

      const upgrades = {};
      GAME_DATA.upgrades.forEach(u => {
        upgrades[u.id] = 0;
      });

      return {
        coins: 180,
        xp: 10,
        level: 1,
        seasonIndex: 0,
        selectedTool: 'select',
        selectedSeed: 'wheat',
        selectedObject: { type: 'plot', id: 0 },
        speedMultiplier: 1,
        dayMode: 'day',
        audioMuted: false,
        inventory: {
          wheat: 3,
          clover: 3,
          corn: 2,
          buffalo_milk: 1,
          baladi_eggs: 1
        },
        plots,
        animals,
        facilities,
        upgrades,
        orders: [],
        completedQuests: [],
        stats: {
          cameraMoves: 0,
          totalPlanted: 3,
          totalWatered: 2,
          totalHarvested: 0,
          totalSoldItems: 0,
          totalAnimalCollected: 0,
          totalCraftStarted: 0,
          totalCraftCollected: 0,
          totalOrdersCompleted: 0,
          totalUpgradesBought: 0
        },
        lastTimestamp: Date.now()
      };
    }

    let state = createInitialState();

    function getItemEffectivePrice(itemId) {
      const meta = ITEM_CATALOG[itemId];
      if (!meta) return 10;
      const season = SEASONS[state.seasonIndex || 0] || SEASONS[0];
      const mult = season.bonusItems.includes(itemId) ? season.mult : 1.0;
      return Math.round(meta.sellPrice * mult);
    }

    function generateOrder(slotIndex) {
      const npcKeys = ['ragab', 'salma', 'shawky', 'hassan'];
      const npcId = npcKeys[slotIndex % npcKeys.length];
      const availableCrops = GAME_DATA.crops.filter(c => c.unlockLevel <= state.level);
      const crop = availableCrops[slotIndex % availableCrops.length] || GAME_DATA.crops[0];
      const count1 = 1 + (slotIndex % 2);

      const items = [{ id: crop.id, count: count1 }];
      if (slotIndex % 4 === 1) items.push({ id: 'baladi_eggs', count: 1 });
      else if (slotIndex % 4 === 2) items.push({ id: 'baladi_bread', count: 1 });
      else if (slotIndex % 4 === 3) items.push({ id: 'buffalo_milk', count: 1 });

      let baseValue = 0;
      items.forEach(it => {
        baseValue += getItemEffectivePrice(it.id) * it.count;
      });

      const souqBonus = 1 + (state.upgrades.upgrade_souq || 0) * 0.15;
      const rewardCoins = Math.round(baseValue * 1.35 * souqBonus);
      const rewardXp = Math.round(12 + items.length * 10 + state.level * 3);

      const titles = [
        'طلبية الغيط الصباحية',
        'مستلزمات الفرن والخبيز',
        'عقد توريد السوق الشعبي',
        'تموين ورشة القرية'
      ];

      return {
        id: 'ord_' + Date.now() + '_' + slotIndex + '_' + Math.floor(Math.random() * 999),
        npcId,
        title: titles[slotIndex % titles.length],
        items,
        rewardCoins,
        rewardXp
      };
    }

    function ensureOrders() {
      if (!Array.isArray(state.orders) || state.orders.length < 4) {
        state.orders = [0, 1, 2, 3].map(i => generateOrder(i));
      }
    }

    function getStorageMax() {
      return 50 + (state.upgrades.expand_storage || 0) * 30;
    }

    function getStorageUsed() {
      return Object.values(state.inventory).reduce((acc, v) => acc + (Number(v) || 0), 0);
    }

    function getXpRequired(lvl) {
      return lvl * 50;
    }

    function getDynamicStat(statName) {
      if (statName === 'animalsOwnedCount') {
        return Object.values(state.animals).filter(a => a.owned).length;
      }
      if (statName === 'unlockedPlotsCount') {
        return state.plots.filter(p => p.unlocked).length;
      }
      return state.stats[statName] || 0;
    }

    function saveGame() {
      state.lastTimestamp = Date.now();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {}
    }

    function loadGame() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.plots) && parsed.plots.length === 20) {
            state = Object.assign(createInitialState(), parsed);
            const now = Date.now();
            const deltaSec = Math.max(0, Math.min(86400, (now - (state.lastTimestamp || now)) / 1000));
            if (deltaSec > 3) {
              advanceTimers(deltaSec, true);
              setTimeout(() => {
                showToast(`مرحباً بعودتك! تقدّم الإنتاج خلال غيابك (${Math.round(deltaSec)} ثانية) 🌾`, 'info');
              }, 600);
            }
          }
        }
      } catch (err) {}
      ensureOrders();
    }

    let audioCtx = null;
    function playSound(type) {
      if (state.audioMuted) return;
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'plant') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(480, now + 0.11);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
          osc.start(now);
          osc.stop(now + 0.13);
        } else if (type === 'water') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(290, now + 0.16);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
          osc.start(now);
          osc.stop(now + 0.17);
        } else if (type === 'harvest' || type === 'coin') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(740.0, now + 0.07);
          osc.frequency.setValueAtTime(880.0, now + 0.14);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (type === 'levelup') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(554.37, now + 0.1);
          osc.frequency.setValueAtTime(659.25, now + 0.2);
          osc.frequency.setValueAtTime(880, now + 0.3);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          osc.start(now);
          osc.stop(now + 0.55);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(190, now);
          osc.frequency.setValueAtTime(150, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        }
      } catch (e) {}
    }

    function showToast(message, kind = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const colors = {
        success: 'bg-emerald-800 text-emerald-50 border-emerald-400',
        warn: 'bg-amber-800 text-amber-50 border-amber-400',
        error: 'bg-red-800 text-red-50 border-red-400',
        info: 'bg-sky-900 text-sky-50 border-sky-400'
      };
      el.className = `px-4 py-2 rounded-2xl border-2 shadow-xl text-xs sm:text-sm font-extrabold flex items-center gap-2 transition-all duration-300 ${colors[kind] || colors.success}`;
      el.textContent = message;
      while (container.children.length >= 2) { container.removeChild(container.firstChild); }
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-10px)';
        setTimeout(() => el.remove(), 300);
      }, 2600);
    }

    function spawnFloatingText(text, color = '#fef08a', x = null, y = null) {
      const layer = document.getElementById('floating-fx-layer');
      if (!layer) return;
      const div = document.createElement('div');
      div.className = 'floating-reward text-sm sm:text-base';
      div.style.color = color;
      const posX = x !== null ? x : (window.innerWidth * 0.5 + (Math.random() - 0.5) * 140);
      const posY = y !== null ? y : (window.innerHeight * 0.48 + (Math.random() - 0.5) * 80);
      div.style.left = `${posX}px`;
      div.style.top = `${posY}px`;
      div.textContent = text;
      layer.appendChild(div);
      setTimeout(() => div.remove(), 1550);
    }

    function addXpAndCoins(coinsDelta, xpDelta, fxLabel = '') {
      if (coinsDelta !== 0) {
        state.coins = Math.max(0, state.coins + coinsDelta);
      }
      if (xpDelta > 0) {
        state.xp += xpDelta;
        while (state.xp >= getXpRequired(state.level)) {
          state.xp -= getXpRequired(state.level);
          state.level += 1;
          playSound('levelup');
          showToast(`🎉 مبروك! ارتفع مستواك إلى المستوى ${state.level} وفتحت محاصيل ومزايا جديدة!`, 'success');
        }
      }
      if (fxLabel) {
        spawnFloatingText(fxLabel, '#fde047');
      }
      updateHUD();
      saveGame();
    }

    function addToInventory(itemId, count) {
      const used = getStorageUsed();
      const max = getStorageMax();
      if (used + count > max) {
        playSound('error');
        showToast('🏺 المخزن ممتلئ! بِع بعض المنتجات أو طوّر الصومعة مع المهندس حسن.', 'error');
        return false;
      }
      state.inventory[itemId] = (state.inventory[itemId] || 0) + count;
      return true;
    }

    function hasIngredients(inputs) {
      return inputs.every(req => (state.inventory[req.id] || 0) >= req.count);
    }

    function consumeIngredients(inputs) {
      if (!hasIngredients(inputs)) return false;
      inputs.forEach(req => {
        state.inventory[req.id] = Math.max(0, (state.inventory[req.id] || 0) - req.count);
      });
      return true;
    }

    function getSaqiaWaterBonus() {
      return 1.35 + (state.upgrades.upgrade_saqia || 0) * 0.12;
    }

    function getWorkshopSpeedBonus() {
      return 1 + (state.upgrades.upgrade_workshops || 0) * 0.18;
    }

    function plantPlot(plotId, seedId = state.selectedSeed, silent = false) {
      const plot = state.plots[plotId];
      if (!plot) return false;
      if (!plot.unlocked) {
        if (!silent) {
          playSound('error');
          showToast('🔒 هذه الأرض غير مستصلحة بعد. افتحها من قسم التطوير والتوسعة!', 'warn');
        }
        return false;
      }
      if (plot.cropId) {
        if (!silent) showToast('🌱 هذه الأرض مزروعة بالفعل!', 'info');
        return false;
      }
      const crop = GAME_DATA.crops.find(c => c.id === seedId);
      if (!crop) return false;
      if (state.level < crop.unlockLevel) {
        if (!silent) {
          playSound('error');
          showToast(`🔒 محصول ${crop.name} يتطلب المستوى ${crop.unlockLevel}.`, 'warn');
        }
        return false;
      }
      if (state.coins < crop.seedCost) {
        if (!silent) {
          playSound('error');
          showToast(`🪙 رصيدك غير كافٍ لشراء بذور ${crop.name} (${crop.seedCost} ج.م).`, 'error');
        }
        return false;
      }

      state.coins -= crop.seedCost;
      plot.cropId = crop.id;
      plot.plantedAt = Date.now();
      plot.elapsedSec = 0;
      plot.watered = (state.upgrades.upgrade_saqia || 0) >= 3;
      state.stats.totalPlanted += 1;
      if (plot.watered) state.stats.totalWatered += 1;

      if (!silent) {
        playSound('plant');
        spawnFloatingText(`-${crop.seedCost} ج.م 🌱 زراعة ${crop.name}`, '#86efac');
      }
      sync3DWorld();
      updateHUD();
      renderInspector();
      saveGame();
      return true;
    }

    function waterPlot(plotId, silent = false) {
      const plot = state.plots[plotId];
      if (!plot || !plot.unlocked) return false;
      if (!plot.cropId) {
        if (!silent) showToast('💧 ازرع الأرض أولاً قبل ريّها من الترعة!', 'info');
        return false;
      }
      if (plot.watered) {
        if (!silent) showToast('💧 هذه الأرض مروية بالفعل بطمي النيل.', 'info');
        return false;
      }
      plot.watered = true;
      state.stats.totalWatered += 1;
      if (!silent) {
        playSound('water');
        spawnFloatingText('💧 ريّ من الساقية (+سرعة نمو)', '#7dd3fc');
      }
      sync3DWorld();
      updateHUD();
      renderInspector();
      saveGame();
      return true;
    }

    function isPlotReady(plot) {
      if (!plot || !plot.cropId) return false;
      const crop = GAME_DATA.crops.find(c => c.id === plot.cropId);
      if (!crop) return false;
      return plot.elapsedSec >= crop.growTimeSec;
    }

    function harvestPlot(plotId, silent = false) {
      const plot = state.plots[plotId];
      if (!plot || !plot.cropId) return false;
      const crop = GAME_DATA.crops.find(c => c.id === plot.cropId);
      if (!crop) return false;
      if (plot.elapsedSec < crop.growTimeSec) {
        if (!silent) {
          const left = Math.ceil(crop.growTimeSec - plot.elapsedSec);
          showToast(`⏳ ${crop.name} لا يزال ينمو (${left} ثانية متبقية). اروِه لتسريع النمو!`, 'info');
        }
        return false;
      }

      if (!addToInventory(crop.id, 1)) return false;

      plot.cropId = null;
      plot.elapsedSec = 0;
      plot.watered = false;
      state.stats.totalHarvested += 1;
      addXpAndCoins(0, crop.xp, !silent ? `+1 ${crop.icon} ${crop.name} (+${crop.xp} XP)` : '');
      if (!silent) playSound('harvest');

      sync3DWorld();
      updateHUD();
      renderInspector();
      saveGame();
      return true;
    }

    function plantAllEmptyPlots() {
      let count = 0;
      for (let i = 0; i < state.plots.length; i++) {
        if (state.plots[i].unlocked && !state.plots[i].cropId) {
          if (plantPlot(i, state.selectedSeed, true)) {
            count++;
          } else {
            break;
          }
        }
      }
      if (count > 0) {
        playSound('plant');
        showToast(`🚜 تمت زراعة ${count} قطع أرض بمحصول ${ITEM_CATALOG[state.selectedSeed].name}!`, 'success');
      } else {
        showToast('لا توجد أراضٍ فارغة متاحة أو الرصيد غير كافٍ.', 'warn');
      }
    }

    function waterAllPlantedPlots() {
      let count = 0;
      for (let i = 0; i < state.plots.length; i++) {
        if (state.plots[i].unlocked && state.plots[i].cropId && !state.plots[i].watered) {
          if (waterPlot(i, true)) count++;
        }
      }
      if (count > 0) {
        playSound('water');
        showToast(`🌊 دارت الساقية وروت ${count} قطع أرض بمياه الترعة!`, 'success');
      } else {
        showToast('جميع الأراضي المزروعة مروية بالفعل!', 'info');
      }
    }

    function harvestAllReadyPlots() {
      let count = 0;
      for (let i = 0; i < state.plots.length; i++) {
        if (isPlotReady(state.plots[i])) {
          if (harvestPlot(i, true)) count++;
          else break;
        }
      }
      if (count > 0) {
        playSound('harvest');
        showToast(`🌾 تم حصاد ${count} محاصيل ناضجة وإضافتها إلى الصومعة والمخزن!`, 'success');
      } else {
        showToast('لا توجد محاصيل جاهزة للحصاد حالياً.', 'info');
      }
    }

    function instantGrowAll() {
      state.plots.forEach(p => {
        if (p.cropId) {
          const c = GAME_DATA.crops.find(x => x.id === p.cropId);
          if (c && p.elapsedSec < c.growTimeSec) {
            p.elapsedSec = c.growTimeSec;
          }
        }
      });
      GAME_DATA.animals.forEach(a => {
        const st = state.animals[a.id];
        if (st && st.owned && st.feeding && st.elapsedSec < a.prodTimeSec) {
          st.elapsedSec = a.prodTimeSec;
        }
      });
      GAME_DATA.facilities.forEach(f => {
        const st = state.facilities[f.id];
        if (st && st.activeRecipeId) {
          const rec = f.recipes.find(r => r.id === st.activeRecipeId);
          if (rec && st.elapsedSec < rec.timeSec) {
            st.elapsedSec = rec.timeSec;
          }
        }
      });
      playSound('harvest');
      sync3DWorld();
      updateHUD();
      renderInspector();
      refreshActiveModal();
      showToast('✨ وضع الاختبار: تم إنضاج جميع المحاصيل والحظيرة والورش فوراً!', 'success');
    }

    function advanceTimers(dtSec, silent = false) {
      const mult = state.speedMultiplier || 1;
      const effDt = dtSec * mult;
      const waterBonus = getSaqiaWaterBonus();
      const craftBonus = getWorkshopSpeedBonus();

      let visualStageChanged = false;

      state.plots.forEach(p => {
        if (!p.cropId) return;
        const crop = GAME_DATA.crops.find(c => c.id === p.cropId);
        if (!crop) return;
        if (p.elapsedSec < crop.growTimeSec) {
          const prevStage = Math.floor((p.elapsedSec / crop.growTimeSec) * 3);
          const rate = p.watered ? waterBonus : 1.0;
          p.elapsedSec = Math.min(crop.growTimeSec, p.elapsedSec + effDt * rate);
          const newStage = Math.floor((p.elapsedSec / crop.growTimeSec) * 3);
          if (prevStage !== newStage || p.elapsedSec >= crop.growTimeSec) {
            visualStageChanged = true;
          }
        }
      });

      GAME_DATA.animals.forEach(a => {
        const st = state.animals[a.id];
        if (st && st.owned && st.feeding && st.elapsedSec < a.prodTimeSec) {
          st.elapsedSec = Math.min(a.prodTimeSec, st.elapsedSec + effDt);
        }
      });

      GAME_DATA.facilities.forEach(f => {
        const st = state.facilities[f.id];
        if (st && st.activeRecipeId) {
          const rec = f.recipes.find(r => r.id === st.activeRecipeId);
          if (rec && st.elapsedSec < rec.timeSec) {
            st.elapsedSec = Math.min(rec.timeSec, st.elapsedSec + effDt * craftBonus);
          }
        }
      });

      if (visualStageChanged && !silent) {
        sync3DWorld();
      }
    }

    const cameraState = {
      targetX: 0,
      targetZ: 0,
      zoom: 1.05,
      yawIndex: 0,
      yawAngle: Math.PI / 4,
      targetYawAngle: Math.PI / 4,
      isDragging: false,
      dragStartX: 0,
      dragStartY: 0,
      pointerMoved: false
    };

    const CAMERA_BOOKMARKS = {
      overview: { x: 0, z: 0, zoom: 0.95, label: 'نظرة شاملة للقرية' },

    function updateThreeCamera() {

      const aspect = window.innerWidth / window.innerHeight;

      camera.position.set(
        cameraState.targetX + Math.cos(cameraState.yawAngle) * dist,
        22,
        cameraState.targetZ + Math.sin(cameraState.yawAngle) * dist
      );
      camera.lookAt(cameraState.targetX, 0, cameraState.targetZ);
    }

        pm.ringMesh.material.visible = (state.selectedObject && state.selectedObject.type === 'plot' && state.selectedObject.id === idx);

          const crop = GAME_DATA.crops.find(c => c.id === p.cropId);
          if (crop) {
            const ratio = Math.min(1, p.elapsedSec / crop.growTimeSec);
            const stage = ratio >= 1 ? 3 : (ratio >= 0.5 ? 2 : 1);
            const h = stage === 1 ? 0.35 : (stage === 2 ? 0.75 : 1.15);
            const stalkColor = stage === 3 ? crop.colorHex : 0x4ade80;

            for (let sx = -0.5; sx <= 0.5; sx += 0.5) {

    let screenHitBoxes = [];

    function projectIso3D(wx, wy, wz, width, height) {
      const dx = wx - cameraState.targetX;
      const dz = wz - cameraState.targetZ;
      const cosA = Math.cos(cameraState.yawAngle - Math.PI / 4);
      const sinA = Math.sin(cameraState.yawAngle - Math.PI / 4);
      const rx = dx * cosA - dz * sinA;
      const rz = dx * sinA + dz * cosA;

      const scale = 32 * cameraState.zoom;
      const sx = width * 0.5 + (rx - rz) * scale;
      const sy = height * 0.52 + (rx + rz) * scale * 0.52 - wy * scale * 0.85;
      return { x: sx, y: sy, depth: rx + rz, scale };
    }

    function drawIsoPrism(ctx, wx, wy, wz, w, h, d, topColor, leftColor, rightColor, width, height) {
      const hw = w / 2;
      const hd = d / 2;
      const p000 = projectIso3D(wx - hw, wy, wz - hd, width, height);
      const p100 = projectIso3D(wx + hw, wy, wz - hd, width, height);
      const p101 = projectIso3D(wx + hw, wy, wz + hd, width, height);
      const p001 = projectIso3D(wx - hw, wy, wz + hd, width, height);

      const p010 = projectIso3D(wx - hw, wy + h, wz - hd, width, height);
      const p110 = projectIso3D(wx + hw, wy + h, wz - hd, width, height);
      const p111 = projectIso3D(wx + hw, wy + h, wz + hd, width, height);
      const p011 = projectIso3D(wx - hw, wy + h, wz + hd, width, height);

      ctx.fillStyle = leftColor;
      ctx.beginPath();
      ctx.moveTo(p011.x, p011.y);
      ctx.lineTo(p111.x, p111.y);
      ctx.lineTo(p101.x, p101.y);
      ctx.lineTo(p001.x, p001.y);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = rightColor;
      ctx.beginPath();
      ctx.moveTo(p111.x, p111.y);
      ctx.lineTo(p110.x, p110.y);
      ctx.lineTo(p100.x, p100.y);
      ctx.lineTo(p101.x, p101.y);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = topColor;
      ctx.beginPath();
      ctx.moveTo(p010.x, p010.y);
      ctx.lineTo(p110.x, p110.y);
      ctx.lineTo(p111.x, p111.y);
      ctx.lineTo(p011.x, p011.y);
      ctx.closePath();
      ctx.fill();

      return p111;
    }

    function renderFallbackIsoScene(canvas, timeSec) {
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      const w = canvas.width;
      const h = canvas.height;

      const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
      if (state.dayMode === 'golden') {
        skyGrad.addColorStop(0, '#fed7aa');
        skyGrad.addColorStop(1, '#fde68a');
      } else if (state.dayMode === 'night') {
        skyGrad.addColorStop(0, '#0f172a');
        skyGrad.addColorStop(1, '#1e293b');
      } else {
        skyGrad.addColorStop(0, '#bae6fd');
        skyGrad.addColorStop(1, '#dcfce7');
      }
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h);

      drawIsoPrism(ctx, -0.5, -0.8, 0.5, 29, 0.8, 24,
        state.dayMode === 'night' ? '#14532d' : (state.dayMode === 'golden' ? '#65a30d' : '#84cc16'),
        '#4d7c0f', '#3f6212', w, h);

      drawIsoPrism(ctx, 3.2, 0.0, 0.8, 2.8, 0.06, 20, '#e6ccb2', '#d4a373', '#b08968', w, h);
      drawIsoPrism(ctx, -1.0, 0.0, -3.2, 18, 0.06, 2.2, '#e6ccb2', '#d4a373', '#b08968', w, h);

      drawIsoPrism(ctx, -10.5, -0.1, 0.5, 3.0, 0.18, 24, '#0284c7', '#0369a1', '#075985', w, h);

      const boatZ = Math.sin(timeSec * 0.7) * 3.5;
      drawIsoPrism(ctx, -10.5, 0.12, boatZ, 1.0, 0.35, 2.0, '#92400e', '#78350f', '#451a03', w, h);
      drawIsoPrism(ctx, -10.5, 0.45, boatZ, 0.2, 1.3, 0.9, '#fef3c7', '#fde68a', '#f59e0b', w, h);

      drawIsoPrism(ctx, -10.5, 0.1, -3.2, 3.6, 0.3, 1.9, '#b45309', '#92400e', '#78350f', w, h);
      drawIsoPrism(ctx, -10.5, 0.1, 4.5, 3.6, 0.3, 1.9, '#b45309', '#92400e', '#78350f', w, h);

      const drawables = [];
      screenHitBoxes = [];

      state.plots.forEach((p, idx) => {
        const pos = getPlotPosition(idx);
        const proj = projectIso3D(pos.x, 0.15, pos.z, w, h);
        drawables.push({
          depth: proj.depth,
          draw: () => {
            const isSelected = state.selectedObject && state.selectedObject.type === 'plot' && state.selectedObject.id === idx;
            const topCol = !p.unlocked ? '#a3b18a' : (p.watered ? '#4a2c11' : '#8c5a32');
            const leftCol = !p.unlocked ? '#588157' : '#3b220c';
            const rightCol = !p.unlocked ? '#3a5a40' : '#291707';

            drawIsoPrism(ctx, pos.x, 0, pos.z, 1.95, 0.22, 1.85, topCol, leftCol, rightCol, w, h);

            if (isSelected) {
              ctx.strokeStyle = '#facc15';
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.arc(proj.x, proj.y, proj.scale * 0.95, 0, Math.PI * 2);
              ctx.stroke();
            }

            screenHitBoxes.push({
              type: 'plot',
              id: idx,
              x: proj.x,
              y: proj.y,
              r: proj.scale * 0.95,
              depth: proj.depth + 10
            });

            if (!p.unlocked) {
              ctx.font = `bold ${Math.max(11, Math.round(proj.scale * 0.42))}px Cairo`;
              ctx.textAlign = 'center';
              ctx.fillStyle = '#fef3c7';
              ctx.fillText('🔒', proj.x, proj.y + 4);
            } else if (p.cropId) {
              const crop = GAME_DATA.crops.find(c => c.id === p.cropId);
              if (crop) {
                const ratio = Math.min(1, p.elapsedSec / crop.growTimeSec);
                const stage = ratio >= 1 ? 3 : (ratio >= 0.5 ? 2 : 1);
                const ch = stage === 1 ? 0.3 : (stage === 2 ? 0.65 : 1.05);
                const cTop = stage === 3 ? '#facc15' : (stage === 2 ? '#22c55e' : '#86efac');
                drawIsoPrism(ctx, pos.x, 0.22, pos.z, 1.1, ch, 1.1, cTop, '#15803d', '#166534', w, h);

                const topPt = projectIso3D(pos.x, 0.22 + ch + 0.3, pos.z, w, h);
                ctx.font = `bold ${Math.max(12, Math.round(proj.scale * 0.52))}px Cairo`;
                ctx.textAlign = 'center';
                ctx.fillText(crop.icon, topPt.x, topPt.y);

                if (ratio >= 1) {
                  const bounce = Math.sin(timeSec * 5 + idx) * 4;
                  ctx.fillStyle = '#fef08a';
                  ctx.font = `bold ${Math.max(10, Math.round(proj.scale * 0.34))}px Cairo`;
                  ctx.fillText('★ جاهز', topPt.x, topPt.y - 16 + bounce);
                } else {
                  const bw = proj.scale * 1.1;
                  const bh = 5;
                  ctx.fillStyle = 'rgba(0,0,0,0.55)';
                  ctx.fillRect(topPt.x - bw / 2, topPt.y + 4, bw, bh);
                  ctx.fillStyle = p.watered ? '#38bdf8' : '#4ade80';
                  ctx.fillRect(topPt.x - bw / 2, topPt.y + 4, bw * ratio, bh);
                }
              }
            }
          }
        });
      });

      LANDMARKS_3D.forEach(lm => {
        const proj = projectIso3D(lm.x, lm.h * 0.5, lm.z, w, h);
        drawables.push({
          depth: proj.depth,
          draw: () => {
            drawIsoPrism(ctx, lm.x, 0, lm.z, lm.w, lm.h, lm.d, lm.color, '#78350f', '#451a03', w, h);
            const roofPt = projectIso3D(lm.x, lm.h + 0.55, lm.z, w, h);

            ctx.font = `bold ${Math.max(11, Math.round(proj.scale * 0.36))}px Cairo`;
            ctx.textAlign = 'center';
            const labelText = `${lm.icon} ${lm.name}`;
            const tw = ctx.measureText(labelText).width + 12;
            ctx.fillStyle = 'rgba(43, 29, 14, 0.82)';
            ctx.beginPath();
            if (ctx.roundRect) {
              ctx.roundRect(roofPt.x - tw / 2, roofPt.y - 18, tw, 22, 8);
            } else {
              ctx.rect(roofPt.x - tw / 2, roofPt.y - 18, tw, 22);
            }
            ctx.fill();
            ctx.fillStyle = '#fef3c7';
            ctx.fillText(labelText, roofPt.x, roofPt.y - 3);

            screenHitBoxes.push({
              type: 'landmark',
              id: lm.id,
              lm,
              x: proj.x,
              y: proj.y,
              r: proj.scale * 1.45,
              depth: proj.depth + 20
            });
          }
        });
      });

      NPCS_3D.forEach(npc => {
        const proj = projectIso3D(npc.x, 0.7, npc.z, w, h);
        drawables.push({
          depth: proj.depth,
          draw: () => {
            drawIsoPrism(ctx, npc.x, 0, npc.z, 0.75, 1.35, 0.75, npc.color, '#1e3a8a', '#172554', w, h);
            const headPt = projectIso3D(npc.x, 1.65, npc.z, w, h);
            ctx.font = 'bold 12px Cairo';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`👤 ${npc.name}`, headPt.x, headPt.y - 4);

            screenHitBoxes.push({
              type: 'npc',
              id: npc.id,
              npc,
              x: proj.x,
              y: proj.y,
              r: proj.scale * 0.9,
              depth: proj.depth + 30
            });
          }
        });
      });

      PALM_TREES_3D.forEach(pt => {
        const proj = projectIso3D(pt.x, 1.2, pt.z, w, h);
        drawables.push({
          depth: proj.depth,
          draw: () => {
            drawIsoPrism(ctx, pt.x, 0, pt.z, 0.4, 2.3 * pt.s, 0.4, '#78350f', '#5c3a21', '#3b220c', w, h);
            drawIsoPrism(ctx, pt.x, 2.2 * pt.s, pt.z, 1.6 * pt.s, 0.7 * pt.s, 1.6 * pt.s, '#16a34a', '#15803d', '#166534', w, h);
          }
        });
      });

      drawables.sort((a, b) => a.depth - b.depth);
      drawables.forEach(d => d.draw());
    }

    let lastFrameTime = performance.now();
    function gameLoop(nowMs) {
      const dt = Math.min(0.25, Math.max(0.001, (nowMs - lastFrameTime) / 1000));
      lastFrameTime = nowMs;
      const timeSec = nowMs / 1000;

      cameraState.yawAngle += (cameraState.targetYawAngle - cameraState.yawAngle) * 0.14;
      advanceTimers(dt, false);

      const canvas = document.getElementById('game-canvas');
      if (useThreeWebGL && renderer && scene && camera) {
        updateThreeCamera();
        if (saqiaWheelMesh) saqiaWheelMesh.rotation.x += dt * 1.1;
        if (millBladesMesh) millBladesMesh.rotation.z += dt * 1.4;
        if (canalBoatMesh) canalBoatMesh.position.z = Math.sin(timeSec * 0.65) * 4.0;
        renderer.render(scene, camera);
      } else if (canvas) {
        renderFallbackIsoScene(canvas, timeSec);
      }

      requestAnimationFrame(gameLoop);
    }

    function setupViewportInput(canvas) {
      if (!canvas) return;
      onViewportResize();

      canvas.onpointerdown = e => {
        cameraState.isDragging = true;
        cameraState.dragStartX = e.clientX;
        cameraState.dragStartY = e.clientY;
        cameraState.pointerMoved = false;
      };

      window.onpointermove = e => {
        if (!cameraState.isDragging) return;
        const dx = e.clientX - cameraState.dragStartX;
        const dy = e.clientY - cameraState.dragStartY;
        if (Math.hypot(dx, dy) > 6) {
          cameraState.pointerMoved = true;
          cameraState.dragStartX = e.clientX;
          cameraState.dragStartY = e.clientY;

          const panSpeed = 0.022 / cameraState.zoom;
          const cosA = Math.cos(cameraState.yawAngle - Math.PI / 4);
          const sinA = Math.sin(cameraState.yawAngle - Math.PI / 4);
          const worldDx = (-dx * 0.7 - dy) * panSpeed;
          const worldDz = (dx * 0.7 - dy) * panSpeed;

          cameraState.targetX = Math.max(-13, Math.min(13, cameraState.targetX + worldDx * cosA + worldDz * sinA));
          cameraState.targetZ = Math.max(-11, Math.min(11, cameraState.targetZ - worldDx * sinA + worldDz * cosA));

          if (state.stats.cameraMoves < 5) {
            state.stats.cameraMoves += 1;
            updateHUD();
          }
        }
      };

      window.onpointerup = e => {
        if (!cameraState.isDragging) return;
        const wasMoved = cameraState.pointerMoved;
        cameraState.isDragging = false;
        const currentCanvas = document.getElementById('game-canvas');
        if (!wasMoved && e.target === currentCanvas) {
          handleCanvasClick(e.clientX, e.clientY);
        }
      };

      canvas.onwheel = e => {
        e.preventDefault();
        const zoomDelta = e.deltaY < 0 ? 0.12 : -0.12;
        cameraState.zoom = Math.max(0.65, Math.min(1.85, cameraState.zoom + zoomDelta));
        state.stats.cameraMoves += 1;
        updateHUD();
      };
    }

    function onViewportResize() {
      const canvas = document.getElementById('game-canvas');
      if (!canvas) return;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (useThreeWebGL && renderer) {
        renderer.setSize(window.innerWidth, window.innerHeight);
        updateThreeCamera();
      }
    }

    function handleCanvasClick(clientX, clientY) {
      if (useThreeWebGL && camera) {
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(
          (clientX / window.innerWidth) * 2 - 1,
          -(clientY / window.innerHeight) * 2 + 1
        );
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(interactiveMeshes, false);
        if (hits.length > 0) {
          const data = hits[0].object.userData;
          on3DObjectPicked(data);
          return;
        }
      } else {
        const candidates = screenHitBoxes.filter(hb => Math.hypot(clientX - hb.x, clientY - hb.y) <= hb.r);
        if (candidates.length > 0) {
          candidates.sort((a, b) => b.depth - a.depth);
          const top = candidates[0];
          on3DObjectPicked({ pickType: top.type, id: top.id, lm: top.lm, npc: top.npc });
          return;
        }
      }
    }

    function on3DObjectPicked(data) {
      if (!data) return;
      if (data.pickType === 'plot') {
        const plotId = data.id;
        state.selectedObject = { type: 'plot', id: plotId };
        const plot = state.plots[plotId];

        if (state.selectedTool === 'water') {
          waterPlot(plotId);
        } else if (state.selectedTool === 'harvest') {
          harvestPlot(plotId);
        } else {
          if (isPlotReady(plot)) {
            harvestPlot(plotId);
          } else if (plot.unlocked && !plot.cropId) {
            plantPlot(plotId, state.selectedSeed);
          } else {
            sync3DWorld();
            renderInspector();
          }
        }
      } else if (data.pickType === 'landmark') {
        state.selectedObject = { type: 'landmark', id: data.id, lm: data.lm };
        renderInspector();
        if (data.lm && data.lm.modal) {
          openModal(data.lm.modal);
        }
      } else if (data.pickType === 'npc') {
        state.selectedObject = { type: 'npc', id: data.id, npc: data.npc };
        renderInspector();
        const prof = NPC_PROFILES[data.id];
        if (prof) {
          showToast(`🗣️ ${prof.name}: "${prof.greeting}"`, 'info');
        }
      }
    }

    let activeModalName = null;

    function updateHUD() {
      document.getElementById('hud-level').textContent = state.level;
      const reqXp = getXpRequired(state.level);
      const pct = Math.min(100, Math.round((state.xp / reqXp) * 100));
      document.getElementById('hud-xp-bar').style.width = `${pct}%`;
      document.getElementById('hud-xp-text').textContent = `${state.xp} / ${reqXp} خبرة`;

      document.getElementById('hud-coins').textContent = state.coins;
      document.getElementById('hud-storage-used').textContent = getStorageUsed();
      document.getElementById('hud-storage-max').textContent = getStorageMax();
      document.getElementById('hud-plots-unlocked').textContent = state.plots.filter(p => p.unlocked).length;

      const curSeason = SEASONS[state.seasonIndex || 0] || SEASONS[0];
      const seasonBadge = document.getElementById('season-badge');
      if (seasonBadge) seasonBadge.textContent = curSeason.name;

      const barnReady = GAME_DATA.animals.some(a => {
        const st = state.animals[a.id];
        return st && st.owned && st.feeding && st.elapsedSec >= a.prodTimeSec;
      });
      document.getElementById('badge-barn-ready').classList.toggle('hidden', !barnReady);

      const craftReady = GAME_DATA.facilities.some(f => {
        const st = state.facilities[f.id];
        if (!st || !st.activeRecipeId) return false;
        const rec = f.recipes.find(r => r.id === st.activeRecipeId);
        return rec && st.elapsedSec >= rec.timeSec;
      });
      document.getElementById('badge-craft-ready').classList.toggle('hidden', !craftReady);

      const orderReady = state.orders.some(ord => hasIngredients(ord.items));
      document.getElementById('badge-orders-ready').classList.toggle('hidden', !orderReady);

      const questReady = QUEST_LIST.some(q => !state.completedQuests.includes(q.id) && getDynamicStat(q.stat) >= q.target);
      document.getElementById('badge-quests-ready').classList.toggle('hidden', !questReady);

      renderActiveQuestTracker();
    }

    function populateQuickSeedSelect() {
      const sel = document.getElementById('quick-seed-select');
      if (!sel) return;
      sel.innerHTML = GAME_DATA.crops.map(c => {
        const locked = state.level < c.unlockLevel;
        return `<option value="${c.id}" ${c.id === state.selectedSeed ? 'selected' : ''} ${locked ? 'disabled' : ''}>
          ${c.icon} ${c.name} (${c.seedCost} ج.م)${locked ? ` [مستوى ${c.unlockLevel}]` : ''}
        </option>`;
      }).join('');
    }

    function renderActiveQuestTracker() {
      const box = document.getElementById('active-quest-box');
      const countEl = document.getElementById('tracker-quest-progress-count');
      if (!box) return;

      const completedCount = state.completedQuests.length;
      if (countEl) countEl.textContent = `${completedCount} / ${QUEST_LIST.length}`;

      const nextQuest = QUEST_LIST.find(q => !state.completedQuests.includes(q.id));
      if (!nextQuest) {
        box.innerHTML = `<div class="text-emerald-800 font-extrabold text-center py-1">🏆 أتممت جميع الـ 30 مهمة بنجاح!</div>`;
        return;
      }

      const cur = Math.min(nextQuest.target, getDynamicStat(nextQuest.stat));
      const ready = cur >= nextQuest.target;
      const npc = NPC_PROFILES[nextQuest.npc];

      box.innerHTML = `
        <div class="flex items-center gap-2 mb-1">
          <img src="${npc.avatarSrc}" alt="${npc.name}" class="w-8 h-8 rounded-full object-cover border border-amber-500" />
          <div class="flex-1 min-w-0">
            <div class="font-extrabold text-amber-950 truncate">${nextQuest.title}</div>
            <div class="text-[10px] text-amber-700">${npc.name} • +${nextQuest.rewardCoins} ج.م</div>
          </div>
        </div>
        <p class="text-[11px] text-stone-700 leading-snug mb-1.5">${nextQuest.desc}</p>
        <div class="flex items-center justify-between gap-2">
          <div class="flex-1 bg-amber-950/10 h-2 rounded-full overflow-hidden">
            <div class="bg-emerald-600 h-full transition-all" style="width:${Math.round((cur / nextQuest.target) * 100)}%"></div>
          </div>
          <span class="text-[10px] font-black text-amber-900">${cur}/${nextQuest.target}</span>
        </div>
        ${ready ? `<button type="button" onclick="claimQuestReward(${nextQuest.id})" class="mt-2 w-full py-1 rounded-lg btn-gold text-xs font-black">🎁 استلام المكافأة (+${nextQuest.rewardCoins} ج.م)</button>` : ''}
      `;
    }

    function claimQuestReward(questId) {
      const q = QUEST_LIST.find(x => x.id === questId);
      if (!q || state.completedQuests.includes(questId)) return;
      if (getDynamicStat(q.stat) < q.target) return;

      state.completedQuests.push(questId);
      playSound('levelup');
      addXpAndCoins(q.rewardCoins, q.rewardXp, `🎁 مكافأة مهمة: +${q.rewardCoins} ج.م`);
      showToast(`🌟 أحسنت! أكملت مهمة "${q.title}" واستلمت ${q.rewardCoins} ج.م و ${q.rewardXp} خبرة!`, 'success');
      populateQuickSeedSelect();
      updateHUD();
      refreshActiveModal();
    }
    window.claimQuestReward = claimQuestReward;

    function renderInspector() {
      const iconEl = document.getElementById('inspector-icon');
      const titleEl = document.getElementById('inspector-title');
      const subEl = document.getElementById('inspector-subtitle');
      const bodyEl = document.getElementById('inspector-body');
      if (!bodyEl) return;

      const sel = state.selectedObject || { type: 'plot', id: 0 };

      if (sel.type === 'plot') {
        const plot = state.plots[sel.id] || state.plots[0];
        iconEl.textContent = plot.cropId ? (ITEM_CATALOG[plot.cropId]?.icon || '🌱') : '🌾';
        titleEl.textContent = `قطعة أرض زراعية #${plot.id + 1}`;
        subEl.textContent = !plot.unlocked ? 'أرض غير مستصلحة' : (plot.watered ? 'مروية بطمي النيل 💧' : 'أرض جاهزة للزراعة');

        if (!plot.unlocked) {
          bodyEl.innerHTML = `
            <p class="text-stone-600">هذه القطعة تحتاج إلى استصلاح وتوسعة من قسم التطوير مع المهندس حسن.</p>
            <button type="button" onclick="openModal('upgrades')" class="w-full py-1.5 rounded-xl btn-earth font-extrabold">🛠️ فتح التطوير والتوسعة</button>
          `;
        } else if (!plot.cropId) {
          const seedMeta = GAME_DATA.crops.find(c => c.id === state.selectedSeed) || GAME_DATA.crops[0];
          bodyEl.innerHTML = `
            <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-2">
              <div class="font-bold text-emerald-950">البذرة المختارة: ${seedMeta.icon} ${seedMeta.name}</div>
              <div class="text-[11px] text-emerald-800">التكلفة: ${seedMeta.seedCost} ج.م • النمو: ${seedMeta.growTimeSec}ث • البيع: ${getItemEffectivePrice(seedMeta.id)} ج.م</div>
            </div>
            <div class="grid grid-cols-2 gap-1.5">
              <button type="button" onclick="plantPlot(${plot.id}, state.selectedSeed)" class="py-1.5 rounded-xl btn-primary font-extrabold">🌱 ازرع الآن</button>
              <button type="button" onclick="openModal('seeds')" class="py-1.5 rounded-xl bg-amber-100 hover:bg-amber-200 border border-amber-300 font-extrabold text-amber-950">🌾 قائمة البذور</button>
            </div>
          `;
        } else {
          const crop = GAME_DATA.crops.find(c => c.id === plot.cropId);
          const ratio = Math.min(1, plot.elapsedSec / crop.growTimeSec);
          const pct = Math.round(ratio * 100);
          const ready = ratio >= 1;
          bodyEl.innerHTML = `
            <div class="bg-amber-50 border border-amber-200 rounded-xl p-2 space-y-1">
              <div class="flex justify-between font-extrabold text-amber-950">
                <span>${crop.icon} ${crop.name}</span>
                <span>${pct}%</span>
              </div>
              <div class="w-full bg-amber-900/15 h-2.5 rounded-full overflow-hidden">
                <div class="bg-emerald-600 h-full transition-all" style="width:${pct}%"></div>
              </div>
              <div class="text-[11px] text-stone-600">${ready ? '✨ المحصول ناضج وجاهز للحصاد!' : `الوقت المتبقي: ~${Math.ceil(crop.growTimeSec - plot.elapsedSec)} ثانية`}</div>
            </div>
            <div class="flex gap-1.5">
              ${ready
                ? `<button type="button" onclick="harvestPlot(${plot.id})" class="flex-1 py-1.5 rounded-xl btn-gold font-extrabold">🌾 احصد المحصول</button>`
                : (!plot.watered
                    ? `<button type="button" onclick="waterPlot(${plot.id})" class="flex-1 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-extrabold">💧 اروِ من الترعة</button>`
                    : `<span class="flex-1 py-1 text-center text-sky-800 font-bold bg-sky-50 rounded-xl border border-sky-200">💧 مروية بالساقية</span>`
                  )
              }
            </div>
          `;
        }
      } else if (sel.type === 'landmark' && sel.lm) {
        const lm = sel.lm;
        iconEl.textContent = lm.icon;
        titleEl.textContent = lm.name;
        subEl.textContent = lm.subtitle;
        bodyEl.innerHTML = `
          <p class="text-stone-700">${lm.subtitle}</p>
          ${lm.modal ? `<button type="button" onclick="openModal('${lm.modal}')" class="w-full py-1.5 rounded-xl btn-primary font-extrabold">فتح ${lm.name}</button>` : `
            <button type="button" onclick="waterAllPlantedPlots()" class="w-full py-1.5 rounded-xl bg-sky-600 text-white font-extrabold">🌊 تشغيل الساقية لريّ الحقول</button>
          `}
        `;
      } else if (sel.type === 'npc' && sel.npc) {
        const prof = NPC_PROFILES[sel.id];
        iconEl.textContent = '🗣️';
        titleEl.textContent = prof.name;
        subEl.textContent = prof.role;
        bodyEl.innerHTML = `
          <div class="flex items-center gap-2 bg-amber-50 p-2 rounded-xl border border-amber-200">
            <img src="${prof.avatarSrc}" alt="${prof.name}" class="w-11 h-11 rounded-full object-cover border border-amber-500" />
            <p class="text-[11px] text-amber-950 font-semibold leading-snug">"${prof.greeting}"</p>
          </div>
          <button type="button" onclick="openModal('${sel.npc.modal}')" class="w-full py-1.5 rounded-xl btn-gold font-extrabold">التفاعل مع ${prof.name}</button>
        `;
      }
    }

    function downloadStandaloneHTML() {
      const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      playSound('levelup');
      showToast('📥 تم تحميل ملف اللعبة (index.html) بنجاح على جهازك!', 'success');
    }
